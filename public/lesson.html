<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<title>Lesson Generator</title>
	<link rel="stylesheet" href="styles/style.css">
</head>

<body>
	<div class="container">
		<div class="page-header">
			<h1>Lesson Generator</h1>
			<p class="subtitle">Create interactive lesson content for your students</p>
		</div>
		
		<form id="lesson-form" action="/api/v1/lesson" method="POST">
			<div class="form-group">
				<label for="courseTitle">Course Name:</label>
				<input type="text" id="courseTitle" name="courseTitle" required>
			</div>

			<div class="form-group">
				<label for="title">Lesson Title:</label>
				<input type="text" id="title" name="title" required>
			</div>

			<div class="form-group">
				<label for="objectId">Object ID</label>
				<input type="text" id="objectId" name="objectId" readonly>
			</div>

			<div class="form-group">
				<label for="pageUrl">Page URL:</label>
				<input type="url" id="pageUrl" name="pageUrl" required>
			</div>

			<button type="submit" class="submit-btn">Generate Lesson SCORM</button>

			<details class="form-group">
				<summary>Scoring Settings</summary>
				<fieldset>
					<div class="form-group">
						<label for="scoreMethod">Score Method:</label>
						<select id="scoreMethod" name="scoreMethod">
							<option value="pageProgress">Page Progress</option>
							<option value="videoProgress">Video Progress</option>
							<option value="exerciseSubmissions">Exercise Submissions</option>
						</select>
					</div>

					<div class="form-group">
						<label for="completionStatus">Completion Status:</label>
						<select id="completionStatus" name="completionStatus">
							<option value="pageProgress">Page Progress</option>
							<option value="videoPercentage">Video Percentage</option>
							<option value="allVideosCompleted">All Videos Completed</option>
							<option value="allExercisesSubmitted">All Exercises Submitted</option>
							<option value="openedModule">Opened Module</option>
						</select>
					</div>

					<div class="form-group">
						<label for="passingScore">Passing Score:</label>
						<input type="number" id="passingScore" name="passingScore" 
							   min="0" max="100" value="70">
					</div>

					<div class="form-group">
						<label for="videoCompletionPercent">Video Completion Percent:</label>
						<input type="number" id="videoCompletionPercent" name="videoCompletionPercent" 
							   min="1" max="100" value="95">
						<small>Percentage of video that must be watched to count as complete</small>
					</div>

					<div class="form-group">
						<label for="maxScore">Maximum Score:</label>
						<input type="number" id="maxScore" name="maxScore" 
							   min="1" max="1000" value="100">
					</div>

					<div class="form-group">
						<label for="minScore">Minimum Score:</label>
						<input type="number" id="minScore" name="minScore" 
							   min="0" max="999" value="0">
					</div>

					<div class="form-group">
						<label>
							<input type="checkbox" name="roundScore" checked>
							Round scores to whole numbers
						</label>
					</div>
				</fieldset>
			</details>

			<details class="form-group">
				<summary>Tracking Settings</summary>
				<fieldset>
					<div class="form-group">
						<label>
							<input type="checkbox" name="trackVideoProgress" checked>
							Track video progress
						</label>
					</div>

					<div class="form-group">
						<label>
							<input type="checkbox" name="trackPageProgress" checked>
							Track page scrolling progress
						</label>
					</div>

					<div class="form-group">
						<label>
							<input type="checkbox" name="trackHintOpenings" checked>
							Track hint openings
						</label>
					</div>

					<div class="form-group">
						<label>
							<input type="checkbox" name="trackSolutionOpenings" checked>
							Track solution openings
						</label>
					</div>
				</fieldset>
			</details>

			<details class="form-group">
				<summary>Advanced Settings</summary>
				<fieldset>
					<div class="form-group">
						<label for="completionBar">Completion Bar:</label>
						<select id="completionBar" name="completionBar">
							<option value="pageProgress">Page Progress</option>
							<option value="videoProgress">Video Progress</option>
							<option value="exerciseSubmissions">Exercise Submissions</option>
							<option value="none">None</option>
						</select>
					</div>

					<div class="form-group">
						<label>
							<input type="checkbox" name="disableContextMenu" checked>
							Disable right-click menu
						</label>
					</div>
				</fieldset>
			</details>

			<div class="settings-management">
				<h3>Settings Management</h3>
				
			<div class="form-group">
				<button type="button" id="save-settings-btn" class="secondary-btn">Save Current Settings</button>
			</div>

			<div class="form-group">
				<label for="saved-settings-list">Saved Settings:</label>
				<select id="saved-settings-list">
					<option value="">Select saved settings...</option>
				</select>
				<button type="button" id="load-settings-btn" class="secondary-btn">Load</button>
				<button type="button" id="delete-settings-btn" class="secondary-btn danger">Delete</button>
			</div>
			</div>
		</form>
	</div>

	<script>
		// Settings management functionality
		const STORAGE_KEYS = {
			autoSave: 'lesson-form-autosave',
			savedSettings: 'lesson-saved-settings'
		}

		// Get all form data as an object
		const getFormData = () => {
			const form = document.getElementById('lesson-form')
			const formData = new FormData(form)
			const data = {}
			
			// Fields to exclude from settings (course info should not be saved)
			const excludeFields = ['courseName', 'lessonTitle', 'pageUrl']
			
			// Handle regular inputs
			for (let [key, value] of formData.entries()) {
				if (!excludeFields.includes(key)) {
					data[key] = value
				}
			}
			
			// Handle checkboxes (they won't appear in FormData if unchecked)
			const checkboxes = form.querySelectorAll('input[type="checkbox"]')
			checkboxes.forEach(checkbox => {
				if (!excludeFields.includes(checkbox.name)) {
					data[checkbox.name] = checkbox.checked
				}
			})
			
			return data
		}

		// Load form data from an object
		const loadFormData = (data) => {
			Object.entries(data).forEach(([key, value]) => {
				const element = document.querySelector(`[name="${key}"]`)
				if (!element) return
				
				if (element.type === 'checkbox') {
					element.checked = value === true || value === 'true'
				} else {
					element.value = value
				}
			})
		}

		// Auto-save form data on input
		const autoSaveForm = () => {
			const data = getFormData()
			localStorage.setItem(STORAGE_KEYS.autoSave, JSON.stringify(data))
		}

		// Load auto-saved data
		const loadAutoSaved = () => {
			const saved = localStorage.getItem(STORAGE_KEYS.autoSave)
			if (saved) {
				loadFormData(JSON.parse(saved))
			}
		}

		// Get all saved settings
		const getSavedSettings = () => {
			const saved = localStorage.getItem(STORAGE_KEYS.savedSettings)
			return saved ? JSON.parse(saved) : {}
		}

		// Save settings with a name
		const saveSettings = (name) => {
			const data = getFormData()
			const allSettings = getSavedSettings()
			allSettings[name] = data
			localStorage.setItem(STORAGE_KEYS.savedSettings, JSON.stringify(allSettings))
			updateSavedSettingsList()
		}

		// Load settings by name
		const loadSettings = (name) => {
			const allSettings = getSavedSettings()
			if (allSettings[name]) {
				loadFormData(allSettings[name])
			}
		}

		// Delete settings by name
		const deleteSettings = (name) => {
			const allSettings = getSavedSettings()
			delete allSettings[name]
			localStorage.setItem(STORAGE_KEYS.savedSettings, JSON.stringify(allSettings))
			updateSavedSettingsList()
		}

		// Update the saved settings dropdown
		const updateSavedSettingsList = () => {
			const select = document.getElementById('saved-settings-list')
			const settings = getSavedSettings()
			
			// Clear existing options except the first one
			select.innerHTML = '<option value="">Select saved settings...</option>'
			
			// Add saved settings as options
			Object.keys(settings).forEach(name => {
				const option = document.createElement('option')
				option.value = name
				option.textContent = name
				select.appendChild(option)
			})
		}

		// Initialize settings management
		document.addEventListener('DOMContentLoaded', () => {
			// Load auto-saved data on page load
			loadAutoSaved()
			updateSavedSettingsList()

			// Auto-save on form changes
			const form = document.getElementById('lesson-form')
			form.addEventListener('input', autoSaveForm)
			form.addEventListener('change', autoSaveForm)

			// Save settings button
			document.getElementById('save-settings-btn').addEventListener('click', () => {
				const name = prompt('Enter a name for these settings:')
				if (name && name.trim()) {
					saveSettings(name.trim())
					alert(`Settings saved as "${name.trim()}"`)
				}
			})

			// Load settings button
			document.getElementById('load-settings-btn').addEventListener('click', () => {
				const select = document.getElementById('saved-settings-list')
				const name = select.value
				if (name) {
					loadSettings(name)
					alert(`Settings "${name}" loaded`)
				}
			})

			// Delete settings button
			document.getElementById('delete-settings-btn').addEventListener('click', () => {
				const select = document.getElementById('saved-settings-list')
				const name = select.value
				if (name && confirm(`Delete settings "${name}"?`)) {
					deleteSettings(name)
					select.value = ''
					alert(`Settings "${name}" deleted`)
				}
			})
		})
	</script>

	<script type="module">
		// Import shared SCORM downloader utility
		import { handleScormGeneration } from '/public/scripts/scorm-downloader.js';
		// Import and setup object ID auto-generation
		import { setupAutoObjectIdGeneration } from '/public/scripts/object-id-generator.js';
		
		// Setup auto-generation for lesson form
		// courseTitle, title (lesson title), objectId
		setupAutoObjectIdGeneration('courseTitle', 'title', 'objectId');

		// Setup SCORM form handler using shared utility
		document.addEventListener('DOMContentLoaded', () => {
			const form = document.getElementById('lesson-form');
			if (form) {
				form.addEventListener('submit', async (e) => {
					e.preventDefault();
					await handleScormGeneration(form, '/api/v1/lesson', {
						defaultFilename: 'lesson-scorm.zip'
					});
				});
			}
		});
	</script>
</body>

</html>
